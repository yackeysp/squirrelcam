<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SquirrelCam</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            text-align: center;
        }

        header {
            background-color: #2f5d3a;
            color: white;
            padding: 30px;
        }

        h1 {
            margin: 0;
            font-size: 42px;
        }

        .subtitle {
            margin-top: 8px;
            font-size: 18px;
        }

        .content {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.12);
        }

        .status {
            color: #2f5d3a;
            font-weight: bold;
            font-size: 20px;
        }
    </style>
</head>

<body>

<header>
    <h1>🐿️ SquirrelCam</h1>
    <div class="subtitle">
        Squirrel Detection & Deterrent System
    </div>
</header>

<div class="content">

    <div class="card">
        <h2>SquirrelCam is Online</h2>

        <p class="status">
            ● System Active
        </p>

        <p>
            Monitoring the bird feeder for unwanted visitors.
        </p>

        <p>
            Detection photos and spray videos coming soon.
        </p>
    </div>

</div>

</body>
</html>
